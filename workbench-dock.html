<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'"><title>工作台面板</title><link rel="stylesheet" href="assets/workbench-dock.css"></head>
<body><nav aria-label="工作台面板"><div id="dock-tabs" role="tablist" aria-label="工具标签"></div><div class="secondary"><button data-panel="files">文件</button><button data-panel="review">审查</button><button data-panel="preview">预览</button></div><div class="actions"><select id="dock-size" aria-label="面板高度"><option value="240">紧凑</option><option value="360">标准</option><option value="500">展开</option></select><button id="dock-detach" title="在独立窗口打开当前工具">↗</button><button id="dock-collapse" title="收起面板，运行中的任务不停止">收起</button></div></nav><span id="dock-status" role="status" aria-live="polite"></span><script src="assets/workbench-dock.js"></script></body></html>
