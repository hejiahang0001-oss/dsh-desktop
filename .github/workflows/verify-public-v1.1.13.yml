name: Verify public V1.1.13 anonymously
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Fully download four public assets without credentials
        shell: pwsh
        run: |
          $assets = @(
            @{name='DSH-Desktop-Setup-1.1.13.exe';bytes=189335584;sha256='6a64f24d4f7e8dca44a868157da5ba394a1f2273e386e78386509e8461cfe58e'},
            @{name='DSH-Desktop-Portable-1.1.13.exe';bytes=188642184;sha256='d5b4adad944099fd536a4655b410907b1684228b5656ed16bf32aedb5ae8024f'},
            @{name='DSH-Desktop-Setup-1.1.13.exe.blockmap';bytes=194897;sha256='920c4fcbddec50c370d97f6273c5a57227030f0e78e70eddf8a2cf23fd3a84a8'},
            @{name='SHA256SUMS-v1.1.13.txt';bytes=297;sha256='6e78b8aad02aca6252a4fa10955d516232770725e780a26acd65e78af92c2479'}
          )
          New-Item -ItemType Directory -Path public-verification | Out-Null
          $results = @()
          foreach ($asset in $assets) {
            $destination = Join-Path public-verification $asset.name
            $uri = 'https://github.com/hejiahang0001-oss/dsh-desktop/releases/download/v1.1.13/' + $asset.name
            $response = Invoke-WebRequest -Uri $uri -OutFile $destination -PassThru -TimeoutSec 300 -MaximumRedirection 5
            if ($response.StatusCode -ne 200) { throw 'Expected anonymous HTTP 200' }
            $bytes = (Get-Item -LiteralPath $destination).Length
            $digest = (Get-FileHash -LiteralPath $destination).Hash.ToLowerInvariant()
            if ($bytes -ne $asset.bytes -or $digest -ne $asset.sha256) { throw ('Public asset mismatch: ' + $asset.name) }
            $results += @{name=$asset.name;bytes=$bytes;sha256=$digest;ok=$true;httpStatus=200}
          }
          $lines = @(Get-Content public-verification/SHA256SUMS-v1.1.13.txt)
          if ($lines.Count -ne 3) { throw 'Expected three checksum entries' }
          $seen = @{}
          foreach ($line in $lines) {
            if ($line -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9.-]+)$') { throw 'Malformed checksum entry' }
            $digest = $Matches[1]; $name = $Matches[2]
            $expected = @($assets | Where-Object { $_.name -eq $name -and $_.sha256 -eq $digest -and !$_.name.EndsWith('.txt') })
            if ($seen.ContainsKey($name) -or $expected.Count -ne 1) { throw 'Checksum manifest mismatch' }
            $seen[$name] = $true
          }
          $result = @{ok=$true;version='1.1.13';authentication='none';location='GitHub windows-latest independent runner';assets=$results;checksumEntries=3;checkedAt=[DateTime]::UtcNow.ToString('o')}
          $result | ConvertTo-Json -Depth 6 | Set-Content public-verification/verification.json -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: public-v1.1.13-verification
          path: public-verification/verification.json
          if-no-files-found: error
