# Independent public-download verification; the original local timeout remains recorded.
name: Verify public V1.1.17 on independent Windows runner

on:
  push:
    branches:
      - codex/release117-public-verification
    paths:
      - .github/workflows/verify-public-v1.1.17.yml
  workflow_dispatch:
    inputs:
      local_verification_finished_without_success:
        description: Original local verifier finished naturally without success; independent fallback authorized
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.repository == 'hejiahang0001-oss/dsh-desktop' && ((github.event_name == 'push' && github.ref == 'refs/heads/codex/release117-public-verification') || (github.event_name == 'workflow_dispatch' && inputs.local_verification_finished_without_success == true)) }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Anonymous complete public GETs; never save or execute binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = 'c5a5a811f6afd932338669f2f5c76e0f27adedd2'
          $repository = 'hejiahang0001-oss/dsh-desktop'
          $canonical = 'https://github.com/' + $repository + '/releases/download/v1.1.17/'
          $assets = @(
            @{name='DSH-Desktop-Setup-1.1.17.exe';bytes=319524389;sha256='4513197f6178a5044ff510f465e6933a0e5df08e6dd53f77ebc74ce948722769'},
            @{name='DSH-Desktop-Setup-1.1.17.exe.blockmap';bytes=332551;sha256='e3b34cced9498bcd09413305014940a72280bc8143f4d3730ebb5dfbdbdaedd6'},
            @{name='DSH-Desktop-Portable-1.1.17.exe';bytes=318738695;sha256='1aa2331ee6b0502eaead12984b2c3598bc2dff61fcf82b37f6ca513544b90880'},
            @{name='SHA256SUMS-v1.1.17.txt';bytes=297;sha256='66e13afd4643296754b51890b11a0be9a35ced785f949012418427b3ba0b6029'}
          )
          $result = [ordered]@{
            schemaVersion=1;kind='public-117-independent-runner-verification';version='1.1.17';ok=$false;complete=$false
            location='GitHub windows-latest independent runner';authentication='none';requestMethod='GET'
            localDownloadCacheUsed=$false;downloadsSaved=$false;executablesExecuted=$false
            localMachineDownloadVerified=$false;localSourceBeforeAfterVerified=$false
            expectedSourceCommit=$sourceCommit;workflowCommit=$env:GITHUB_SHA
            workflowRunId=$env:GITHUB_RUN_ID;workflowRunAttempt=$env:GITHUB_RUN_ATTEMPT
            workflowFile='.github/workflows/verify-public-v1.1.17.yml';workflowJob=$env:GITHUB_JOB
            workflowRef=$env:GITHUB_REF;workflowEvent=$env:GITHUB_EVENT_NAME
            workflowRunUrl=('https://github.com/'+$repository+'/actions/runs/'+$env:GITHUB_RUN_ID)
            checksumManifestVerified=$false
            repository=$repository;expectedAssets=$assets;metadataRequests=@();assets=@()
            startedAt=[DateTime]::UtcNow.ToString('o');failure=$null
          }
          New-Item -ItemType Directory -Path public-verification -Force | Out-Null
          function Save-Receipt {
            $json = $result | ConvertTo-Json -Depth 12
            if ([Text.Encoding]::UTF8.GetByteCount($json) -gt 1048576) { throw 'receipt-too-large' }
            [IO.File]::WriteAllText((Join-Path $PWD 'public-verification/verification.json'), $json, [Text.UTF8Encoding]::new($false))
          }
          Save-Receipt
          $timer = [Diagnostics.Stopwatch]::StartNew()
          $handler = [Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect = $false
          $handler.UseCookies = $false
          $handler.UseDefaultCredentials = $false
          $handler.PreAuthenticate = $false
          $handler.Credentials = $null
          $handler.AutomaticDecompression = [Net.DecompressionMethods]::None
          $client = [Net.Http.HttpClient]::new($handler)
          $client.Timeout = [Threading.Timeout]::InfiniteTimeSpan
          $safeFailures = @('network-budget-exhausted','redirect-refused','redirect-limit','http-not-200','encoding-refused',
            'metadata-too-large','release-identity-mismatch','release-not-public','tag-commit-mismatch',
            'remote-asset-mismatch','asset-too-long','asset-length-mismatch','asset-digest-mismatch','checksum-manifest-mismatch','receipt-too-large')
          function New-Budget([int]$maximumMs) {
            $remaining = 720000 - $timer.ElapsedMilliseconds
            if ($remaining -le 0) { throw 'network-budget-exhausted' }
            return [Threading.CancellationTokenSource]::new([int][Math]::Min($maximumMs,$remaining))
          }
          function Send-Anon([Uri]$uri,[string]$accept,[Threading.CancellationToken]$token,[Collections.Generic.List[object]]$trace) {
            $allowedHosts = @('api.github.com','github.com','release-assets.githubusercontent.com','objects.githubusercontent.com','github-releases.githubusercontent.com')
            for ($redirect=0; $redirect -le 5; $redirect++) {
              if ($uri.Scheme -ne 'https' -or $uri.UserInfo -or $uri.Host -notin $allowedHosts) { throw 'redirect-refused' }
              $request = [Net.Http.HttpRequestMessage]::new([Net.Http.HttpMethod]::Get,$uri)
              $request.Headers.Accept.ParseAdd($accept)
              $request.Headers.AcceptEncoding.ParseAdd('identity')
              $request.Headers.CacheControl = [Net.Http.Headers.CacheControlHeaderValue]::Parse('no-cache, no-store')
              $request.Headers.Pragma.ParseAdd('no-cache')
              $request.Headers.UserAgent.ParseAdd('dsh-desktop-public-verifier/1.1.17')
              try { $response = $client.SendAsync($request,[Net.Http.HttpCompletionOption]::ResponseHeadersRead,$token).GetAwaiter().GetResult() }
              finally { $request.Dispose() }
              $status = [int]$response.StatusCode
              # Record the exact requested canonical URL and effective redirect origin/path.
              # Public CDN signed query strings are deliberately omitted, never logged.
              $trace.Add([ordered]@{url=$uri.GetLeftPart([UriPartial]::Path);queryOmitted=($uri.Query.Length -gt 0);httpStatus=$status})
              if ($status -in @(301,302,303,307,308)) {
                $location = $response.Headers.Location
                if ($null -eq $location) { $response.Dispose(); throw 'redirect-refused' }
                if (!$location.IsAbsoluteUri) { $location = [Uri]::new($uri,$location) }
                $response.Dispose(); $uri=$location; continue
              }
              return $response
            }
            throw 'redirect-limit'
          }
          function Read-AnonymousJson([string]$url) {
            $budget=New-Budget 60000; $response=$null; $stream=$null; $memory=[IO.MemoryStream]::new()
            $trace=[Collections.Generic.List[object]]::new()
            try {
              $response=Send-Anon ([Uri]$url) 'application/vnd.github+json' $budget.Token $trace
              $result.metadataRequests += [ordered]@{requestedUrl=$url;requests=@($trace.ToArray())}
              if ([int]$response.StatusCode -ne 200) { throw 'http-not-200' }
              $stream=$response.Content.ReadAsStreamAsync($budget.Token).GetAwaiter().GetResult()
              $buffer=[byte[]]::new(65536)
              while (($count=$stream.ReadAsync($buffer,0,$buffer.Length,$budget.Token).GetAwaiter().GetResult()) -gt 0) {
                if ($memory.Length+$count -gt 2097152) { throw 'metadata-too-large' }
                $memory.Write($buffer,0,$count)
              }
              return ([Text.Encoding]::UTF8.GetString($memory.ToArray()) | ConvertFrom-Json -AsHashtable)
            } finally {
              if($null -ne $stream){$stream.Dispose()};if($null -ne $response){$response.Dispose()};$memory.Dispose();$budget.Dispose()
            }
          }
          try {
            $release=Read-AnonymousJson ('https://api.github.com/repos/'+$repository+'/releases/tags/v1.1.17')
            $latest=Read-AnonymousJson ('https://api.github.com/repos/'+$repository+'/releases/latest')
            $ref=Read-AnonymousJson ('https://api.github.com/repos/'+$repository+'/git/ref/tags/v1.1.17')
            $object=$ref.object
            for($depth=0; $object.type -eq 'tag' -and $depth -lt 3; $depth++) {
              $tag=Read-AnonymousJson ('https://api.github.com/repos/'+$repository+'/git/tags/'+$object.sha)
              $object=$tag.object
            }
            $result.release=[ordered]@{id=$release.id;tag=$release.tag_name;draft=$release.draft;prerelease=$release.prerelease;latestId=$latest.id;latestTag=$latest.tag_name;latestDraft=$latest.draft;latestPrerelease=$latest.prerelease;resolvedTagCommit=$object.sha}
            if($release.id -ne 416619407 -or $release.tag_name -ne 'v1.1.17'){throw 'release-identity-mismatch'}
            # Public Pre-release is eligible for download verification before Stable promotion.
            # Latest/Stable are recorded above, not asserted by this download-only fallback.
            if($release.draft -ne $false -or $release.prerelease -isnot [bool]){throw 'release-not-public'}
            if($object.type -ne 'commit' -or $object.sha -ne $sourceCommit){throw 'tag-commit-mismatch'}
            if(@($release.assets).Count -ne 4){throw 'remote-asset-mismatch'}
            $result.remoteAssets=@()
            foreach($asset in $assets){
              $remote=@($release.assets | Where-Object {$_.name -eq $asset.name})
              if($remote.Count -ne 1 -or $remote[0].state -ne 'uploaded' -or $remote[0].size -ne $asset.bytes -or $remote[0].browser_download_url -ne ($canonical+$asset.name)){throw 'remote-asset-mismatch'}
              if($remote[0].digest -and $remote[0].digest -ne ('sha256:'+$asset.sha256)){throw 'remote-asset-mismatch'}
              $result.remoteAssets += [ordered]@{name=$remote[0].name;state=$remote[0].state;bytes=$remote[0].size;url=$remote[0].browser_download_url;digest=$remote[0].digest}
            }
            $manifestText=$null
            foreach($asset in $assets) {
              $url=$canonical+$asset.name
              $trace=[Collections.Generic.List[object]]::new()
              $row=[ordered]@{name=$asset.name;requestedUrl=$url;requests=@();httpStatus=$null;bytes=0;sha256=$null;entireResponseConsumed=$false;ok=$false}
              $result.assets += $row
              $budget=New-Budget 300000; $response=$null; $stream=$null; $memory=[IO.MemoryStream]::new()
              $digest=[Security.Cryptography.IncrementalHash]::CreateHash([Security.Cryptography.HashAlgorithmName]::SHA256)
              try {
                $response=Send-Anon ([Uri]$url) 'application/octet-stream' $budget.Token $trace
                $row.httpStatus=[int]$response.StatusCode
                if($row.httpStatus -ne 200){throw 'http-not-200'}
                if(@($response.Content.Headers.ContentEncoding | Where-Object {$_ -ne 'identity'}).Count -gt 0){throw 'encoding-refused'}
                if($null -ne $response.Content.Headers.ContentLength -and $response.Content.Headers.ContentLength -ne $asset.bytes){throw 'asset-length-mismatch'}
                $stream=$response.Content.ReadAsStreamAsync($budget.Token).GetAwaiter().GetResult()
                $buffer=[byte[]]::new(65536)
                while(($count=$stream.ReadAsync($buffer,0,$buffer.Length,$budget.Token).GetAwaiter().GetResult()) -gt 0) {
                  $row.bytes += $count
                  if($row.bytes -gt $asset.bytes){throw 'asset-too-long'}
                  $digest.AppendData($buffer,0,$count)
                  if($asset.name -eq 'SHA256SUMS-v1.1.17.txt'){$memory.Write($buffer,0,$count)}
                }
                $row.entireResponseConsumed=$true
                $row.sha256=[Convert]::ToHexString($digest.GetHashAndReset()).ToLowerInvariant()
                if($row.bytes -ne $asset.bytes){throw 'asset-length-mismatch'}
                if($row.sha256 -ne $asset.sha256){throw 'asset-digest-mismatch'}
                if($asset.name -eq 'SHA256SUMS-v1.1.17.txt'){$manifestText=[Text.Encoding]::UTF8.GetString($memory.ToArray())}
                $row.ok=$true
              } finally {
                $row.requests=@($trace.ToArray())
                if($null -ne $stream){$stream.Dispose()};if($null -ne $response){$response.Dispose()};$digest.Dispose();$memory.Dispose();$budget.Dispose()
              }
            }
            $lines=@($manifestText.TrimEnd([char[]]"`r`n") -split '\r?\n');$seen=@{}
            if($lines.Count -ne 3){throw 'checksum-manifest-mismatch'}
            foreach($line in $lines){
              if($line -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9.-]+)$'){throw 'checksum-manifest-mismatch'}
              $sum=$Matches[1];$name=$Matches[2]
              $expected=@($assets | Where-Object {$_.name -eq $name -and $_.sha256 -eq $sum -and !$_.name.EndsWith('.txt')})
              if($seen.ContainsKey($name) -or $expected.Count -ne 1){throw 'checksum-manifest-mismatch'}
              $seen[$name]=$true
            }
            $result.checksumEntries=3
            $result.checksumManifestVerified=$true
            $result.ok=($result.assets.Count -eq 4 -and @($result.assets | Where-Object {!$_.ok -or !$_.entireResponseConsumed}).Count -eq 0)
          } catch {
            $message=$_.Exception.Message
            $result.failure=if($message -in $safeFailures){$message}else{'network-or-verification-operation-failed'}
            $result.failureType=$_.Exception.GetType().FullName
          } finally {
            $result.complete=$true;$result.completedAt=[DateTime]::UtcNow.ToString('o')
            $result.elapsedMilliseconds=$timer.ElapsedMilliseconds
            $client.Dispose();$handler.Dispose();Save-Receipt
          }
          if(!$result.ok){exit 1}
      - name: Upload only the small independent-runner receipt
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: public-v1.1.17-independent-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-verification/verification.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
