name: Verify public V1.1.12 anonymously
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Fully download four public assets without credentials
        shell: pwsh
        run: |
          $assets = @(
            @{name='DSH-Desktop-Setup-1.1.12.exe';bytes=186690026;sha256='6eeef4379ea02ba1cfe233b50307b5668d2976f0706a74097e3c592e5c9221f9'},
            @{name='DSH-Desktop-Portable-1.1.12.exe';bytes=185996640;sha256='c8e446700997b913b1d50ed0f238c23cfa43a0029f051d7f4966c039b0e4a141'},
            @{name='DSH-Desktop-Setup-1.1.12.exe.blockmap';bytes=192166;sha256='7944568a2e870478eb930fa28e35400a7631d48e3fc83f78be0c5b58cfcec8db'},
            @{name='SHA256SUMS-v1.1.12.txt';bytes=297;sha256='8644f7b0ac23cf3f48f7afd5a0265cba49210346afe8bf2cbf764108bfead962'}
          )
          New-Item -ItemType Directory -Path public-verification | Out-Null
          $results = @()
          foreach ($asset in $assets) {
            $destination = Join-Path public-verification $asset.name
            $uri = 'https://github.com/hejiahang0001-oss/dsh-desktop/releases/download/v1.1.12/' + $asset.name
            $response = Invoke-WebRequest -Uri $uri -OutFile $destination -PassThru -TimeoutSec 300 -MaximumRedirection 5
            if ($response.StatusCode -ne 200) { throw 'Expected anonymous HTTP 200' }
            $bytes = (Get-Item -LiteralPath $destination).Length
            $digest = (Get-FileHash -LiteralPath $destination).Hash.ToLowerInvariant()
            if ($bytes -ne $asset.bytes -or $digest -ne $asset.sha256) { throw ('Public asset mismatch: ' + $asset.name) }
            $results += @{name=$asset.name;bytes=$bytes;sha256=$digest;ok=$true;httpStatus=200}
          }
          $lines = @(Get-Content public-verification/SHA256SUMS-v1.1.12.txt)
          if ($lines.Count -ne 3) { throw 'Expected three checksum entries' }
          $seen = @{}
          foreach ($line in $lines) {
            if ($line -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9.-]+)$') { throw 'Malformed checksum entry' }
            $digest = $Matches[1]; $name = $Matches[2]
            $expected = @($assets | Where-Object { $_.name -eq $name -and $_.sha256 -eq $digest -and !$_.name.EndsWith('.txt') })
            if ($seen.ContainsKey($name) -or $expected.Count -ne 1) { throw 'Checksum manifest mismatch' }
            $seen[$name] = $true
          }
          $result = @{ok=$true;version='1.1.12';authentication='none';location='GitHub windows-latest independent runner';assets=$results;checksumEntries=3;releaseCommit='8ebccb74554d139354e12c8ffe4b14febd3327c6';checkedAt=[DateTime]::UtcNow.ToString('o')}
          $result | ConvertTo-Json -Depth 6 | Set-Content public-verification/verification.json -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: public-v1.1.12-verification
          path: public-verification/verification.json
          if-no-files-found: error
